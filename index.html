<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>명경(明鏡) — 측정하는 사주</title>
<meta name="description" content="사진이 아니라 측정. 몇 번을 봐도 같은 결과. 모든 문장에 근거.">
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="tokens.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--font-sans);background:var(--paper);color:var(--ink);
    display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
  .brand{margin-bottom:18px}
  .brand img{width:150px;height:150px}
  h1{font-size:var(--fs-display);font-weight:var(--fw-display);line-height:1.35;margin-bottom:12px}
  p{font-size:var(--fs-body);color:var(--ink-soft);line-height:var(--lh-body)}
  .mono{font-family:var(--font-mono);color:var(--measure);font-weight:700}
  .soon{display:inline-block;margin-top:22px;border:1.5px dashed var(--ink-soft);
    border-radius:var(--r-chip);padding:6px 14px;font-size:var(--fs-note);color:var(--ink-soft)}
</style>
</head>
<body>
  <main>
    <div class="brand"><img src="assets/logo-transparent.png" alt="명경 明鏡"></div>
    <h1>사진이 아니라, <span class="mono">측정</span>입니다</h1>
    <p>몇 번을 봐도 같은 결과 · 모든 문장에 근거<br>갈리는 해석은 갈린다고 말해드립니다</p>
    <div class="soon">리포트 준비 중</div>
  </main>
</body>
</html>
